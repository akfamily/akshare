[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "akshare"
dynamic = ["version"]
description = "AKShare is an elegant and simple financial data interface library for Python, built for human beings!"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AKFamily", email = "albertandking@gmail.com"}
]
keywords = [
    "stock",
    "option",
    "futures",
    "fund",
    "bond",
    "index",
    "air",
    "finance",
    "spider",
    "quant",
    "quantitative",
    "investment",
    "trading",
    "algotrading",
    "data",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "beautifulsoup4>=4.11.2",
    "lxml>=4.9.2",
    "pandas>=2.2.2",
    "requests>=2.22.0",
    "curl_cffi>=0.13.0",
    "html5lib>=1.1",
    "xlrd>=2.0.1",
    "urllib3>=1.25.8",
    "tqdm>=4.43.0",
    "openpyxl>=3.1.0",
    "mini-racer>=0.12.4; platform_system != 'Linux'",
    "py-mini-racer>=0.6.0; platform_system == 'Linux'",
    "akracer>=0.0.13; platform_system == 'Linux'",
]

[project.urls]
Homepage = "https://github.com/akfamily/akshare"

# 开发依赖走 PEP 735 dependency-groups 而非 extra。extra 会随包发布，
# 原先的 dev extra 意味着终端用户 pip install akshare[dev] 会被装上
# pre-commit、sphinx、ruff 这些与使用本库无关的工具链；组不会进入包元数据。
# 附带好处：uv sync 默认就安装 dev 组，本地无需再记 --extra dev。
#
# 文档依赖刻意不在这里，仍由 docs/requirements.txt 声明。Read the Docs 的
# python.install 只认 requirements 文件与 extra_requirements，不支持 --group；
# 而 docs/conf.py 是以读文件加正则的方式取版本号、从不 import akshare，
# 若改用 extra_requirements 就得连 pandas、lxml、curl_cffi、mini-racer 一起
# 装进文档镜像。因此保留那份文件作为文档依赖的唯一声明。
[dependency-groups]
test = ["pytest>=8.0.0"]
# 本组是 ruff 版本的唯一来源：CI 的 lint job 与 .pre-commit-config.yaml 的
# 本地钩子都经 uv.lock 从本组取用，没有第二处版本号需要同步。
# 编辑器的 LSP 能力由 ruff 自带的 ruff server 子命令提供，无需额外依赖。
# 原先声明的 ruff-lsp 已被 Astral 归档（PyPI 停在 0.0.62 / 2025-02，
# 包自身即会打印废弃警告并指向 ruff server），故不再声明。
lint = ["ruff==0.17.2"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "commitizen>=4.12.1",
    "pre-commit>=3.6.2",
    "mplfinance>=0.12.10b0",
]

# uv.lock 会把解析时用的索引地址逐条写进去，因此项目必须显式声明官方 PyPI。
# 否则谁本地配了镜像，提交的锁文件就带上镜像地址，海外贡献者与 CI 都无法复现。
# 本段优先级高于用户级 uv.toml 与 UV_INDEX_URL 环境变量（已实测），
# 所以配了国内镜像的开发者无需改动个人配置，重新生成的锁文件依然是官方源。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.setuptools.dynamic]
version = {attr = "akshare._version.__version__"}

[tool.setuptools.packages.find]
include = ["akshare*"]

[tool.setuptools.package-data]
"*" = ["*.py", "*.json", "*.pk", "*.js", "*.zip"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# 自 ruff 0.16 起，格式化器会改写 Markdown 中 ```python 围栏块的代码。
# docs/ 下的接口示例与数据示例是手工维护的真实输出，不接受自动改写。
extend-exclude = ["*.md"]

# Same as Black.
line-length = 88
indent-width = 4

# 与 requires-python = ">=3.11" 保持一致，也与 CI 矩阵的下界一致。
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
#
# 另外启用两条 flake8-bandit 安全规则：S307 禁止对上游响应调用 eval（已全部改为
# ast.literal_eval，存量为零）；S501 禁止 verify=False，存量以 # noqa: S501 标记，
# 只拦新增。
#
# TID251 要求数据接口经 akshare.utils.http 发请求（含 curl_cffi 版本），从而统一应用全局超时与代理
# （ak.set_timeout / ak.set_proxies）。它覆盖了 S113（请求未设超时）的用途，
# 因此不再单独启用 S113。
select = ["E4", "E7", "E9", "F", "S307", "S501", "TID251"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests.get".msg = "改用 akshare.utils.http.get，以应用全局超时与代理"
"requests.post".msg = "改用 akshare.utils.http.post，以应用全局超时与代理"
"requests.request".msg = "改用 akshare.utils.http.request，以应用全局超时与代理"
"requests.Session".msg = "改用 akshare.utils.http.Session，以应用全局超时与代理"
"requests.session".msg = "改用 akshare.utils.http.Session，以应用全局超时与代理"
"requests.put".msg = "改用 akshare.utils.http.request，以应用全局超时与代理"
"requests.delete".msg = "改用 akshare.utils.http.request，以应用全局超时与代理"
"requests.head".msg = "改用 akshare.utils.http.request，以应用全局超时与代理"
"requests.patch".msg = "改用 akshare.utils.http.request，以应用全局超时与代理"
"requests.options".msg = "改用 akshare.utils.http.request，以应用全局超时与代理"
"curl_cffi.requests.get".msg = "改用 akshare.utils.http.curl_get，以应用全局超时与代理"
"curl_cffi.requests.post".msg = "改用 akshare.utils.http.curl_post，以应用全局超时与代理"
"curl_cffi.requests.request".msg = "改用 akshare.utils.http.curl_request，以应用全局超时与代理"
"curl_cffi.requests.Session".msg = "改用 akshare.utils.http.CurlSession，以应用全局超时与代理"
"urllib3.PoolManager".msg = "改用 akshare.utils.http.Session 并挂载自定义 HTTPAdapter，以应用全局超时与代理"
"http.client.HTTPSConnection".msg = "改用 akshare.utils.http.get，以应用全局超时与代理"
"http.client.HTTPConnection".msg = "改用 akshare.utils.http.get，以应用全局超时与代理"

[tool.ruff.lint.per-file-ignores]
# 封装本身，以及不发真实请求的测试与仓库脚本
"akshare/utils/http.py" = ["TID251"]
"tests/**" = ["TID251"]
"scripts/**" = ["TID251"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
