# commit setup
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-case-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      # 文档接口描述或 akshare/__init__.py 导入变动后，先重建接口注册表与
      # __all__，避免提交后再被 CI 的 registry-check 拦下。
      - id: build-interface-registry
        name: build interface registry
        entry: python scripts/build_registry.py
        language: system
        files: ^(docs/data/.*\.md|akshare/__init__\.py)$
        pass_filenames: false
        require_serial: true
      # ruff 版本的唯一来源是 pyproject.toml 的 lint 组（经 uv.lock 锁定），
      # 这里与 CI 的 lint job 跑同一条命令，因此不存在第二处版本号需要同步。
      # 原先用 astral-sh/ruff-pre-commit 时，它的 rev 是独立于 lint 组的第二处
      # 钉版，而 Dependabot 的 uv 生态只改得动 pyproject.toml：0.16.3→0.16.4
      # 那次就是 #7408 升级后靠 #7409 人工补 rev。改为本地钩子后该缺口消失。
      # 另有两点是版本号对齐也换不来的：ruff-pre-commit 的 wheel 与 uv.lock 锁定
      # 的 wheel 是两次独立解析；--locked 还会在改过 pyproject.toml 却漏跑
      # uv lock 时直接失败，把 CI 安装步骤的报错提前到提交时。
      # --force-exclude 必需：pre-commit 传入显式文件名时，
      # ruff 默认不再套用自身配置里的 extend-exclude。
      - id: ruff-check
        name: ruff check
        entry: uv run --locked --only-group lint ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --locked --only-group lint ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
  - repo: local
    hooks:
      # 中文正文标点统一为全角。只检查 docstring、# 注释与 Markdown 正文,
      # 中文列名、用户可传参数值、解析上游文本的字面量以及围栏代码块均不在范围内。
      - id: check-punctuation
        name: check Chinese punctuation
        entry: python scripts/check_punctuation.py --fix
        language: system
        files: ^((akshare|docs|scripts|tests)/.*|[^/]+)\.(py|md)$
        # 只排除检查器自身: 它的正文大量引用标点样例（如 "（手续费更新时间："）,
        # 会稳定触发括号配对与引号配平这两条启发式告警, 纳入后每次提交都刷屏,
        # 因此改为靠 --selftest 与手工运行来自检。
        exclude: ^scripts/check_punctuation\.py$
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
